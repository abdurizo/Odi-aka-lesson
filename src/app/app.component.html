<div class="flex">
  <div class="w-[400px] h-screen bg-[#0C1B2A] flex items-center justify-center">
    <div class="flex flex-col gap-[10px]">
      @for (item of links; track item.id) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-stone-200/20"
          [routerLinkActiveOptions]="{ exact: true }"
          class="hover:bg-stone-200/20 transition duration-300 flex items-center justify-center py-[10px] px-[15px] border rounded-[10px] block text-stone-100 uppercase"
          >{{ item.text }}</a
        >
      }
    </div>
  </div>
  <div class="w-full h-full">
    <router-outlet></router-outlet>
  </div>
</div>
